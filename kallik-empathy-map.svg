<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="476" viewBox="0 0 1400 476" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1400" height="476" fill="#f7f5f0"/>
<rect x="1" y="1" width="1398" height="474" fill="none" stroke="rgba(20,35,47,.10)" stroke-width="2" rx="18"/>
<text x="700.0" y="46" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="3" fill="#0f8a97">KALLIK AToM &#183; RESEARCH SYNTHESIS</text>
<text x="700.0" y="80" text-anchor="middle" font-size="30" font-weight="700" fill="#14232f">Empathy Map</text>
<text x="700.0" y="104" text-anchor="middle" font-size="13" fill="rgba(20,35,47,.62)">Says &#183; Thinks &#183; Does &#183; Feels, synthesised from 48 contextual interviews across three role groups</text>
<circle cx="67" cy="139" r="21" fill="#0f8a97"/>
<text x="67" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">A</text>
<text x="100" y="136" font-size="16.5" font-weight="700" fill="#14232f">Aria</text>
<text x="100" y="154" font-size="11.5" fill="rgba(20,35,47,.62)" letter-spacing="0.4">THE DESIGNER</text>
<line x1="40" y1="176" x2="450" y2="176" stroke="rgba(20,35,47,.10)" stroke-width="1.5"/>
<rect x="40" y="192" width="200.0" height="122" rx="10" fill="#0f8a97" fill-opacity="0.10" stroke="#0f8a97" stroke-width="1.3" stroke-opacity="0.5"/>
<text x="54" y="214" font-size="10.5" font-weight="700" letter-spacing="1" fill="#0f8a97">SAYS</text>
<text x="54" y="234" font-size="11.8" fill="#14232f">“I have a folder called</text>
<text x="54" y="250" font-size="11.8" fill="#14232f">Final. Inside it, Actually</text>
<text x="54" y="266" font-size="11.8" fill="#14232f">Final.”</text>
<rect x="250.0" y="192" width="200.0" height="122" rx="10" fill="#b8791c" fill-opacity="0.10" stroke="#b8791c" stroke-width="1.3" stroke-opacity="0.5"/>
<text x="264.0" y="214" font-size="10.5" font-weight="700" letter-spacing="1" fill="#b8791c">THINKS</text>
<text x="264.0" y="234" font-size="11.8" fill="#14232f">I hope this is still the</text>
<text x="264.0" y="250" font-size="11.8" fill="#14232f">latest version.</text>
<rect x="40" y="324" width="200.0" height="122" rx="10" fill="#1f9d55" fill-opacity="0.10" stroke="#1f9d55" stroke-width="1.3" stroke-opacity="0.5"/>
<text x="54" y="346" font-size="10.5" font-weight="700" letter-spacing="1" fill="#1f9d55">DOES</text>
<text x="54" y="366" font-size="11.8" fill="#14232f">Renames files by hand,</text>
<text x="54" y="382" font-size="11.8" fill="#14232f">emails artwork back and</text>
<text x="54" y="398" font-size="11.8" fill="#14232f">forth, avoids touching</text>
<text x="54" y="414" font-size="11.8" fill="#14232f">locked files</text>
<rect x="250.0" y="324" width="200.0" height="122" rx="10" fill="#b8433f" fill-opacity="0.10" stroke="#b8433f" stroke-width="1.3" stroke-opacity="0.5"/>
<text x="264.0" y="346" font-size="10.5" font-weight="700" letter-spacing="1" fill="#b8433f">FEELS</text>
<text x="264.0" y="366" font-size="11.8" fill="#14232f">Anxious about losing track</text>
<text x="264.0" y="382" font-size="11.8" fill="#14232f">of versions; frustrated by</text>
<text x="264.0" y="398" font-size="11.8" fill="#14232f">zero visibility once it's</text>
<text x="264.0" y="414" font-size="11.8" fill="#14232f">sent</text>
<circle cx="522" cy="139" r="21" fill="#0f8a97"/>
<text x="522" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">R</text>
<text x="555" y="136" font-size="16.5" font-weight="700" fill="#14232f">Rowan</text>
<text x="555" y="154" font-size="11.5" fill="rgba(20,35,47,.62)" letter-spacing="0.4">REVIEWER &amp; APPROVER</text>
<line x1="495" y1="176" x2="905" y2="176" stroke="rgba(20,35,47,.10)" stroke-width="1.5"/>
<rect x="495" y="192" width="200.0" height="122" rx="10" fill="#0f8a97" fill-opacity="0.10" stroke="#0f8a97" stroke-width="1.3" stroke-opacity="0.5"/>
<text x="509" y="214" font-size="10.5" font-weight="700" letter-spacing="1" fill="#0f8a97">SAYS</text>
<text x="509" y="234" font-size="11.8" fill="#14232f">“Another 40 flags to check —</text>
<text x="509" y="250" font-size="11.8" fill="#14232f">none of them say why.”</text>
<rect x="705.0" y="192" width="200.0" height="122" rx="10" fill="#b8791c" fill-opacity="0.10" stroke="#b8791c" stroke-width="1.3" stroke-opacity="0.5"/>
<text x="719.0" y="214" font-size="10.5" font-weight="700" letter-spacing="1" fill="#b8791c">THINKS</text>
<text x="719.0" y="234" font-size="11.8" fill="#14232f">I don't trust these AI flags</text>
<text x="719.0" y="250" font-size="11.8" fill="#14232f">enough to skip a manual</text>
<text x="719.0" y="266" font-size="11.8" fill="#14232f">pass.</text>
<rect x="495" y="324" width="200.0" height="122" rx="10" fill="#1f9d55" fill-opacity="0.10" stroke="#1f9d55" stroke-width="1.3" stroke-opacity="0.5"/>
<text x="509" y="346" font-size="10.5" font-weight="700" letter-spacing="1" fill="#1f9d55">DOES</text>
<text x="509" y="366" font-size="11.8" fill="#14232f">Spends 4–6 hrs manually</text>
<text x="509" y="382" font-size="11.8" fill="#14232f">checking labels, closes AI</text>
<text x="509" y="398" font-size="11.8" fill="#14232f">flags unread, approves by</text>
<text x="509" y="414" font-size="11.8" fill="#14232f">email</text>
<rect x="705.0" y="324" width="200.0" height="122" rx="10" fill="#b8433f" fill-opacity="0.10" stroke="#b8433f" stroke-width="1.3" stroke-opacity="0.5"/>
<text x="719.0" y="346" font-size="10.5" font-weight="700" letter-spacing="1" fill="#b8433f">FEELS</text>
<text x="719.0" y="366" font-size="11.8" fill="#14232f">Overwhelmed, time-pressured,</text>
<text x="719.0" y="382" font-size="11.8" fill="#14232f">worried about liability if</text>
<text x="719.0" y="398" font-size="11.8" fill="#14232f">an error slips through</text>
<circle cx="977" cy="139" r="21" fill="#0f8a97"/>
<text x="977" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">F</text>
<text x="1010" y="136" font-size="16.5" font-weight="700" fill="#14232f">Finn</text>
<text x="1010" y="154" font-size="11.5" fill="rgba(20,35,47,.62)" letter-spacing="0.4">PRINT OPERATOR</text>
<line x1="950" y1="176" x2="1360" y2="176" stroke="rgba(20,35,47,.10)" stroke-width="1.5"/>
<rect x="950" y="192" width="200.0" height="122" rx="10" fill="#0f8a97" fill-opacity="0.10" stroke="#0f8a97" stroke-width="1.3" stroke-opacity="0.5"/>
<text x="964" y="214" font-size="10.5" font-weight="700" letter-spacing="1" fill="#0f8a97">SAYS</text>
<text x="964" y="234" font-size="11.8" fill="#14232f">“Is this definitely the</text>
<text x="964" y="250" font-size="11.8" fill="#14232f">right file?”</text>
<rect x="1160.0" y="192" width="200.0" height="122" rx="10" fill="#b8791c" fill-opacity="0.10" stroke="#b8791c" stroke-width="1.3" stroke-opacity="0.5"/>
<text x="1174.0" y="214" font-size="10.5" font-weight="700" letter-spacing="1" fill="#b8791c">THINKS</text>
<text x="1174.0" y="234" font-size="11.8" fill="#14232f">No one tells me if this was</text>
<text x="1174.0" y="250" font-size="11.8" fill="#14232f">actually approved.</text>
<rect x="950" y="324" width="200.0" height="122" rx="10" fill="#1f9d55" fill-opacity="0.10" stroke="#1f9d55" stroke-width="1.3" stroke-opacity="0.5"/>
<text x="964" y="346" font-size="10.5" font-weight="700" letter-spacing="1" fill="#1f9d55">DOES</text>
<text x="964" y="366" font-size="11.8" fill="#14232f">Prints whatever lands in the</text>
<text x="964" y="382" font-size="11.8" fill="#14232f">folder, calls to</text>
<text x="964" y="398" font-size="11.8" fill="#14232f">double-check before running</text>
<text x="964" y="414" font-size="11.8" fill="#14232f">the job</text>
<rect x="1160.0" y="324" width="200.0" height="122" rx="10" fill="#b8433f" fill-opacity="0.10" stroke="#b8433f" stroke-width="1.3" stroke-opacity="0.5"/>
<text x="1174.0" y="346" font-size="10.5" font-weight="700" letter-spacing="1" fill="#b8433f">FEELS</text>
<text x="1174.0" y="366" font-size="11.8" fill="#14232f">Uncertain, anxious about</text>
<text x="1174.0" y="382" font-size="11.8" fill="#14232f">compliance risk,</text>
<text x="1174.0" y="398" font-size="11.8" fill="#14232f">disconnected from the</text>
<text x="1174.0" y="414" font-size="11.8" fill="#14232f">approval chain</text></svg>